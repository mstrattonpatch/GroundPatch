# Conda-forge environment for the PyQGIS worker (app/gis_worker.py and
# app/project_builder.py only). PyQGIS is not a pip package — this is the
# simplest reliable way to get `qgis.core`/`qgis.analysis`/`qgis.processing`
# importable. Not needed to run the rest of the scaffold (see requirements.txt
# and README.md's "Running the stub service locally").
#
#   conda env create -f environment-qgis.yml
#   conda activate groundpatch-gis
#
# Pin the qgis version explicitly once Phase 1 implementation starts — left
# unpinned here only because the exact version to standardise on hasn't been
# decided yet. Pin it the moment that decision is made; an unpinned QGIS
# version is exactly the kind of drift that silently changes Processing
# algorithm behaviour between dev and whatever this eventually deploys to.
name: groundpatch-gis
channels:
  - conda-forge
dependencies:
  - python=3.11
  - qgis
  - pip
  - pip:
      - fastapi==0.115.6
      - uvicorn[standard]==0.34.0
      - pydantic==2.10.4
